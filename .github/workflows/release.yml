# v2.0 — Git tag → GitHub Release notes

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate notes from VERSION.md
        id: notes
        run: |
          {
            echo "## Folio ${{ steps.tag.outputs.name }}"
            echo ""
            echo "자세한 이력: VERSION.md · 마이그레이션: docs/MIGRATION.md"
            echo ""
            echo "### 검증"
            echo "- lint / typecheck / test / qa:smoke / build"
          } > /tmp/release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Folio ${{ steps.tag.outputs.name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
