# P40 — Docker 이미지 빌드 → GHCR 푸시
# Packages: ghcr.io/<owner>/folio
#
# Permissions: packages: write (GITHUB_TOKEN)
# Optional build-args via vars/secrets:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_FOLIO_URL

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FOLIO_VERSION: "3.1.0-wip"

jobs:
  build:
    name: Build · Push (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build-args (PR merge / main env 주입)
        id: args
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          FOLIO_URL: ${{ secrets.NEXT_PUBLIC_FOLIO_URL }}
        run: |
          echo "supabase_url=${SUPABASE_URL:-https://placeholder.supabase.co}" >> "$GITHUB_OUTPUT"
          echo "supabase_anon=${SUPABASE_ANON:-placeholder-anon-key}" >> "$GITHUB_OUTPUT"
          echo "folio_url=${FOLIO_URL:-}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=${{ env.FOLIO_VERSION }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.args.outputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.args.outputs.supabase_anon }}
            NEXT_PUBLIC_FOLIO_URL=${{ steps.args.outputs.folio_url }}
            FOLIO_VERSION=${{ env.FOLIO_VERSION }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Docker (P40)"
            echo "- image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- push: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"
