# P40 — Lint / Typecheck / QA smoke / Build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FOLIO_VERSION: "1.3.0-wip"

jobs:
  quality:
    name: Lint · Typecheck · QA · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: QA smoke
        run: npm run qa:smoke

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
          NEXT_PUBLIC_FOLIO_URL: http://localhost:3000
          FOLIO_VERSION: ${{ env.FOLIO_VERSION }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI (P40)"
            echo "- ref: \`${{ github.sha }}\`"
            echo "- lint / typecheck / qa:smoke / test / build"
            echo "- FOLIO_VERSION=\`${{ env.FOLIO_VERSION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
