# v2.0 — Lint / Typecheck / Unit test / QA / Bundle / Build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FOLIO_VERSION: "4.1.0"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Coverage (P66 · 80% gate)
        run: npm run test:coverage

      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: QA smoke
        run: npm run qa:smoke

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
          NEXT_PUBLIC_FOLIO_URL: http://localhost:3000
          FOLIO_VERSION: ${{ env.FOLIO_VERSION }}

      - name: Bundle size (budget fail)
        run: npm run bundle:size
        env:
          BUNDLE_BUDGET_FAIL: "1"
          FOLIO_BUNDLE_BUDGET_MB: "8"
          FOLIO_INITIAL_JS_BUDGET_KB: "900"

      - name: Playwright E2E (P66)
        run: npx playwright install chromium --with-deps && npm run test:e2e
        continue-on-error: true
        env:
          CI: "true"

      - name: Lighthouse CI
        run: npm run lhci
        continue-on-error: true
        env:
          FOLIO_VERSION: ${{ env.FOLIO_VERSION }}

      - name: Chromatic (optional)
        continue-on-error: true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN 없음 — skip"
            exit 0
          fi
          npx chromatic --project-token="$CHROMATIC_PROJECT_TOKEN" --exit-zero-on-changes

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI (v4.0 P66)"
            echo "- ref: \`${{ github.sha }}\`"
            echo "- required: lint · typecheck · test · coverage(80%) · qa:smoke · build · bundle-size"
            echo "- optional: playwright e2e · lighthouse CI · chromatic"
            echo "- FOLIO_VERSION=\`${{ env.FOLIO_VERSION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
