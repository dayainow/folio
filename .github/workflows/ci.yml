# v2.0 — Lint / Typecheck / Unit test / QA / Bundle / Build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FOLIO_VERSION: "3.6.0-wip"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Coverage (P55, optional gate)
        run: npm run test:coverage
        continue-on-error: true

      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: QA smoke
        run: npm run qa:smoke

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
          NEXT_PUBLIC_FOLIO_URL: http://localhost:3000
          FOLIO_VERSION: ${{ env.FOLIO_VERSION }}

      - name: Bundle size (budget fail)
        run: npm run bundle:size
        env:
          BUNDLE_BUDGET_FAIL: "1"
          FOLIO_BUNDLE_BUDGET_MB: "8"

      - name: Playwright a11y smoke (optional)
        run: npx playwright install chromium --with-deps && npm run test:e2e
        continue-on-error: true
        env:
          CI: "true"

      - name: Lighthouse CI
        run: npm run lhci
        continue-on-error: true
        env:
          FOLIO_VERSION: ${{ env.FOLIO_VERSION }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI (v2.9 P55)"
            echo "- ref: \`${{ github.sha }}\`"
            echo "- required: lint · typecheck · test · qa:smoke · build · bundle-size(budget)"
            echo "- optional: coverage · playwright e2e · lighthouse CI"
            echo "- FOLIO_VERSION=\`${{ env.FOLIO_VERSION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
