# Folio local / self-hosted stack
# 사용: cp docs/env.example .env.local && docker compose up --build
# Health: GET http://localhost:3000/api/health

services:
  folio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
        FOLIO_VERSION: ${FOLIO_VERSION:-1.5.0}
    image: folio:local
    container_name: folio
    ports:
      - "${FOLIO_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      FOLIO_VERSION: ${FOLIO_VERSION:-1.5.0}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_DOMAIN: ${JIRA_DOMAIN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      BEACON_PROJECT_ROOT: ${BEACON_PROJECT_ROOT:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
